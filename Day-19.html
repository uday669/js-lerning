<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Bubbling/Delegation</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-center mb-4 text-primary">Event Bubbling / Delegation</h1>

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow rounded-4">
          <div class="card-body">
            <form class="form">
              <div class="mb-3">
                <label for="inputText" class="form-label">Enter Text</label>
                <input type="text" class="form-control" id="inputText" placeholder="Type something...">
              </div>
              <button type="submit" class="btn btn-success w-100" id="btn">Submit</button>
            </form>

            <hr class="my-4">

            <ul class="list-group" id="list">
            </ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle CDN (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


  <script>
    let inputText = document.querySelector("#inputText")
    let btn = document.querySelector(".form")
    let list = document.querySelector("#list")

    btn.addEventListener("submit" , (e) =>{
        e.preventDefault(); 
        
        let values = inputText.value.trim()

        if(values !== ""){
            let li = document.createElement("li")
            li.classList ="list-group-item d-flex justify-content-between align-items-center"
            li.textContent = values

            list.append(li)
            inputText.values = ""
        }

    })

  </script>

</body>
</html>
