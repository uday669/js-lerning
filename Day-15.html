<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Document</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div>
    <h1 class="new">uday</h1>
    <button class="click">click</button>
  </div>

  <script>
    let nenewElement = document.querySelector(".new");
    let nenclick = document.querySelector(".click");

    nenclick.addEventListener("click", function () {
      if (nenewElement.innerHTML === "mohit") {
        nenewElement.innerHTML = "jay";
      } else {
        nenewElement.innerHTML = "mohit";
      }
    });
  </script>

</body>
</html>
