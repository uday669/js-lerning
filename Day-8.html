<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Arrays (push, pop, splice, slice)</h1>

    <script>
        let Arrays = [40,10,30,20]

        Arrays.push(15,25)
        
        Arrays.sort()
        Arrays.pop()

        Arrays.splice(1 , 0 , 38 ,1) ;

        console.log(Arrays.slice(2,5))
        console.log(Arrays)

        console.log(Arrays.reverse())
    </script>
</body>
</html>
