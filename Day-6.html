<body>
    <h1>Loops (for, while, do while)</h1>
    <h5>Print numbers 1–100</h5>
    <script>
        let a = prompt("enter the number in a 100 to nmber")

        for(a >= 0 ; a <80 ; a++){
            console.log(a)
        }
        let b = 1;

        while (b < 10) {
            console.log(b);
            b++;
        }


        let i = 10;

        do{
            console.log(i);
            i ++
        }
        while(i <0)


    </script>
</body>
