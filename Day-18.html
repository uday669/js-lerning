<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML CSS Form Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .gap-20px {
      row-gap: 20px;
    }
    input {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      border-color: #7b515629;
      background-color: #7b515629;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    button {
      padding: 10px 16px;
      background: orange;
      border-radius: 12px;
      border: 0;
      color: white;
    }

    input:invalid {
      border: 2px solid red;
    }

    input:valid {
      border: 2px solid green;
    }

    p {
      cursor: pointer;
      user-select: none;
      color: blue;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Forms & Input</h1>
  <form class="mt-4" action="#" method="post">
    <div class="row gap-20px">
      <div class="col-6">
        <label for="names">Name</label>
        <input type="text" id="names" name="names" placeholder="Enter your name">
      </div>
      <div class="col-6">
        <label for="number">Phone Number</label>
        <input type="tel" id="number" name="number" placeholder="Enter your phone number" pattern="[0-9]{10}">
      </div>
      <div class="col-6">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
      </div>
      <div class="col-6">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6">
        <p class="mt-1 mb-0" id="show">Show Password</p>
      </div>
      <div class="col-12">
        <button type="submit" class="w-100" id="btn">Submit</button>
      </div>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const btn = document.querySelector("#btn");
  const show = document.querySelector("#show");
  const names = document.querySelector("#names");
  const number = document.querySelector("#number");
  const email = document.querySelector("#email");
  const password = document.querySelector("#password");

  // Toggle password visibility
  show.addEventListener("click", () => {
    password.type = password.type === "password" ? "text" : "password";
  });

  // Validate form on submit
  btn.addEventListener("click", (e) => {
    e.preventDefault(); // Prevent actual form submission

    if (
      names.value.trim() === "" ||
      number.value.trim() === "" ||
      email.value.trim() === "" ||
      password.value.trim() === ""
    ) {
      alert("Please fill out all fields.");
    } else {
      console.log("Name:", names.value);
      console.log("Phone:", number.value);
      console.log("Email:", email.value);
      console.log("Password:", password.value);
      alert("Form submitted successfully!");
    }
  });
</script>

</body>
</html>
