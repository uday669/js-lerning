<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wrapped Y Labels Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    #chartContainer {
      width: 100%;
      max-width: 800px;
      height: 500px;
      margin: auto;
    }

    @media print {
      canvas {
        max-width: 100% !important;
        width: 100% !important;
        height: auto !important;
      }
      .chartjs-size-monitor {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="chartContainer">
    <canvas id="growthChallengesChart"></canvas>
  </div>

  <script>
    const chartCanvas = document.getElementById("growthChallengesChart");
    const isMobile = window.innerWidth <= 480;

    if (isMobile) chartCanvas.height = 550;

    const ctx = chartCanvas.getContext("2d");

    const data = {
      labels: [
        "Team Size\nand Leadership",
        "Technical\nDecision-Making",
        "Career Networking\nOpportunities",
        "Balancing Technical\nand Management",
        "Increasing Organizational\nPolitics",
        "Strategic Business\nKnowledge"
      ],
      datasets: [
        {
          data: [85, 90, 80, null, null, null],
          backgroundColor: "rgba(139, 195, 74, 0.8)",
          barThickness: 30
        },
        {
          data: [null, null, null, 75, 70, 80],
          backgroundColor: "rgba(244, 67, 54, 0.8)",
          barThickness: 30
        }
      ]
    };

    const config = {
      type: "bar",
      data: data,
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            position: "top",
            beginAtZero: true,
            max: 100,
            ticks: {
              callback: (value) => value + "%"
            }
          },
          y: {
            ticks: {
             
              font: () => ({
                size: isMobile ? 8 : 10,
                weight: "bold"
              })
            },
            grid: { display: false }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (context) {
                return context.parsed.x + "%";
              }
            }
          }
        }
      }
    };

    new Chart(ctx, config);
  </script>
</body>
</html>
