<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bootstrap 5 Cards with Add Button</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .newcard{
        padding: 15px;
        border-radius: 10px;
        background: #2500ffc2;
        color: white;
        text-align: center;
    }

  </style>
</head>
<body>

<div class="container my-5">


  <div class="d-flex justify-content-center mb-4 gap-3">
    <button class="btn btn-primary" id="addCardBtn">color chges</button>
    <button class="btn btn-primary" id="addCardBtntwo">chnges text and desing</button>
  </div>

  <div class="row" id="cardContainer">
    <!-- Initial Card 1 -->
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <div class="card-body ">
          <h5 class="card-title">Hi Uday</h5>
          <p class="card-text">This is card 1.</p>
        </div>
      </div>
    </div>
    <!-- Initial Card 2 -->
    <div class="col-md-4 mb-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Welcome Back</h5>
          <p class="card-text">This is card 2.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (Optional for dropdowns etc.) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script>
   let btnone = document.querySelector("#addCardBtn");
let btntwo = document.querySelector("#addCardBtntwo");

let card = document.querySelectorAll(".card-body");

let counter = 0; // to keep track of how many cards to change

btnone.addEventListener("click", function () {
  // Remove class from all
  card.forEach((element) => {
    element.classList.remove("newcard");
  });

  // Reset counter to 0
  counter = 0;
});

btntwo.addEventListener("click", function () {
  // Add class only up to `counter + 1` cards
  if (counter < card.length) {
    card[counter].classList.add("newcard");
    counter++;
  }
});

</script>

</body>
</html>
