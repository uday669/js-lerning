<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Quiz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #quiz-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 90%;
      overflow-y: auto;
      max-height: 90vh;
    }

    h3 {
      margin-bottom: 10px;
    }

    p {
      background: #e0e0e0;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      cursor: pointer;
    }

    .green {
      background: green;
      color: white;
    }

    .red {
      background: red;
      color: white;
    }

    h2 {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="quiz-box">
    <div id="options"></div>
  </div>

  <script>
    const quizData = [
      {
        question: "What does JS stand for?",
        options: ["Java Setup", "Just Style", "JavaScript", "Jumbo Script"],
        correct: "JavaScript"
      },
      {
        question: "Which keyword declares a constant variable?",
        options: ["var", "let", "const", "constant"],
        correct: "const"
      },
      {
        question: "What is the output of 2 + '2' in JS?",
        options: ["4", "NaN", "22", "undefined"],
        correct: "22"
      }
    ];

    let score = 0;
    let answeredQuestions = 0;

    function showData() {
      const dataContainer = document.getElementById("options");
      dataContainer.innerHTML = ""; 

      quizData.forEach((element, qIndex) => {
        let html = `<h3>${element.question}</h3>`;

        element.options.forEach((option, oIndex) => {
          html += `<p class="btn btn-${qIndex}-${oIndex}" data-q="${qIndex}" data-i="${oIndex}">${option}</p>`;
        });

        dataContainer.innerHTML += html;
      });

      // Add event listeners AFTER all HTML is added
      quizData.forEach((element, qIndex) => {
        element.options.forEach((option, oIndex) => {
          const btn = document.querySelector(`.btn-${qIndex}-${oIndex}`);
          btn.addEventListener("click", () => {
            // Prevent multiple clicks on same question
            if (btn.classList.contains("clicked")) return;
            btn.classList.add("clicked");

            // Disable all options for this question
            element.options.forEach((_, i) => {
              const allBtn = document.querySelector(`.btn-${qIndex}-${i}`);
              allBtn.style.pointerEvents = "none";
              allBtn.style.opacity = "0.6";
            });

            // Check the answer
            if (option === element.correct) {
              btn.classList.add("green");
              score++;
              console.log("right");
            } else {
              btn.classList.add("red");
              console.log("no");
            }

            // Track answered questions
            answeredQuestions++;

            // Show score when all questions are answered
            if (answeredQuestions === quizData.length) {
              const result = document.createElement("h2");
              result.textContent = `Your Score: ${score} / ${quizData.length}`;
              document.getElementById("quiz-box").appendChild(result);
            }
          });
        });
      });
    }

    showData();
  </script>

</body>
</html>
