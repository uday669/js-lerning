    <h1>Variables (let, const, var)	</h1>
    

    <script>
    let num = prompt("enter number")
    console.log(`enter first number  = ${num}`)
    let num2 = prompt("enter number second time")
    console.log(`enter second number = ${num2}`)

    let text 

    text = num;
    console.log(`enter new var and num value stoed in text  =  ${text}`)
    num = num2
    console.log(`num2 value stoed in num  =  ${num}`)
    num2 = text
    console.log(`text value stoed in num2  =  ${num2}`)


    console.log(`first number${num}\nsecond number ${num2}`)


    </script>
