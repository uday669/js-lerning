<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data Types (String, Number, Boolean, null, undefined)</h1>


    <script>
        let a = 20
        let b= "uday"
        let c = 15 < 2
        let d = null
        let e 

        console.log(`${typeof a} = ${a}`)
        console.log(`${typeof b} = ${b}`)
        console.log(`${typeof c} = ${c}`)
        console.log(`${typeof d} = ${d}`)
        console.log(`${typeof e} = ${e}`)
        

        // type casting in number to string conver 
        console.log(`${typeof String(a + "20")} = ${a}`)
        console.log(`${typeof Boolean(a  >  b.length)} = ${a > b.length}`)

    </script>
</body>
</html>
